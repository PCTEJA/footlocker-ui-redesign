<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">From 12 percent to 20 percent revenue growth</title><desc id="desc">On a shared baseline of 100, current-trajectory revenue is 112 and target revenue is 120. The gap is 8 index points, or 7.14 percent above 112. These are scenario assumptions, not measured results.</desc><rect width="1200" height="400" rx="16" fill="#111"/><g fill="white" font-family="Arial,sans-serif"><text x="44" y="57" font-size="16" letter-spacing="2" fill="#bcbcbc">THE REVENUE AMBITION</text><text x="44" y="111" font-size="42" font-weight="bold">12% → 20% growth</text><text x="44" y="148" font-size="16" fill="#ccc">Same prior-period base. Comparable reporting periods.</text><text x="44" y="212" font-size="16">Baseline</text><text x="44" y="273" font-size="16">Current trajectory</text><text x="44" y="334" font-size="16">Target</text><rect x="230" y="188" width="500" height="34" rx="3" fill="#666"/><rect x="230" y="249" width="560" height="34" rx="3" fill="#a4a4a4"/><rect x="230" y="310" width="600" height="34" rx="3" fill="#ed40b8"/><text x="748" y="212" font-size="19" font-weight="bold">100</text><text x="808" y="273" font-size="19" font-weight="bold">112</text><text x="848" y="334" font-size="19" font-weight="bold">120</text><text x="928" y="226" font-size="42" font-weight="bold">+7.14%</text><text x="928" y="258" font-size="14" fill="#ccc">revenue above the</text><text x="928" y="281" font-size="14" fill="#ccc">12%-growth trajectory</text><text x="44" y="377" font-size="12" fill="#aaa">Illustrative target arithmetic • Not measured performance • Revenue growth is not conversion rate</text></g></svg>
